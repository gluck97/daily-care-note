<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="description" content="每日记录：点选今天的情况，复制给家人。"><meta property="og:title" content="每日记录"><meta property="og:description" content="点一点，记下今天。"><meta name="apple-mobile-web-app-title" content="每日记录"><meta name="care-ui-version" content="8"><title>每日记录</title><style><!--CARE_CSS--></style></head><body><main>
<header class="hero"><span class="bunny" style="background-position:0% 100%" aria-hidden="true"></span><h1>每日记录</h1><div class="date-wrap"><input type="hidden" id="date"><button type="button" id="date-button" aria-haspopup="dialog" aria-controls="date-dialog"><span></span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 2v6M17 2v6M3 11h18"/></svg></button></div></header>
<form id="feedback" novalidate><div id="fields"></div><p id="status" class="errors" role="status"></p><div class="footerbar" id="footerbar"><div><button class="primary" type="submit" id="generate">生成简报 ↗</button></div></div></form>
<section class="result-card" id="output" hidden><h2>今天的简报</h2><p class="sub">复制 → 回微信粘贴 → 发送</p><textarea id="result" class="result" aria-label="生成的简报" readonly></textarea><div class="actions"><button class="primary" id="copy">复制简报</button><button class="secondary" id="share-result" hidden>系统分享</button></div><p id="copy-status" class="status" role="status"></p><div class="actions"><button class="secondary" id="back-edit">再改一下</button><button class="secondary" id="download">保存文件</button></div></section>
<footer><div class="bottom-tools"><button type="button" class="text-button" id="copy-link">↗ 分享空白页</button><button type="button" class="text-button" id="reset">↺ 重新填写</button><a href="https://www.eviq.org.au/medical-oncology/colorectal/metastatic/986-colorectal-metastatic-folfox6-modified-fluo/patient-information" target="_blank" rel="noopener noreferrer">观察参考</a><a href="https://www.england.nhs.uk/wp-content/uploads/2023/07/Bristol-stool-chart-for-people-with-a-learning-disability-print-version.pdf" target="_blank" rel="noopener noreferrer">便形参考</a></div><p id="link-status" class="status" role="status"></p><input id="form-link" class="hidden-copy" tabindex="-1" aria-label="空白表单链接" readonly value="https://daily-care-note-7d10.preciousberyl2.chatgpt.site"></footer><noscript>请使用支持网页交互的浏览器，或通过微信告诉家人今天的情况。</noscript></main><dialog id="date-dialog" aria-label="选择记录日期"><div class="calendar-head"><button type="button" id="prev-month" aria-label="上个月">‹</button><strong id="month-label" aria-live="polite"></strong><button type="button" id="next-month" aria-label="下个月">›</button></div><div class="weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendar-days" aria-label="日历日期"></div><button type="button" id="close-calendar">取消</button></dialog><!--CARE_CORE--><script><!--CARE_APP--></script></body></html>
